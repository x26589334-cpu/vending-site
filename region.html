<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>지역 페이지로 이동합니다 | 픽프리 PICKFREE</title>
<meta name="robots" content="noindex, follow">
<!--
  옛 주소 호환용 리다이렉트 페이지.
  2026-09-08 부터 지역 페이지는 region/<slug>-vending.html 정적 파일로 바뀌었다.
  region.html?area=seoul-gangnam&dong=역삼동  ->  region/seoul-gangnam-vending.html?dong=역삼동
  새 링크는 여기를 거치지 않는다. 이 파일은 예전 링크·북마크만 받아 넘겨 준다.
-->
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .rdr{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
</style>
</head>
<body>

<div class="rdr">
  <div>
    <p class="eyebrow">REDIRECTING</p>
    <h1 class="display d2" style="margin:14px 0 18px">지역 페이지로 이동합니다</h1>
    <p class="lead" id="msg">잠시만 기다려 주세요.</p>
    <div class="btns" style="justify-content:center;margin-top:28px">
      <a class="btn" href="locations.html">지역찾기로 가기 <span class="ar">→</span></a>
      <a class="btn btn--ghost" href="index.html">홈으로</a>
    </div>
  </div>
</div>

<script src="assets/js/region-data.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var slug = q.get('area') || '';
  var dong = q.get('dong') || '';

  /* 실제로 있는 지역인지 확인한 뒤에만 넘긴다 */
  var ok = false;
  (window.RDATA || []).forEach(function (g) {
    g.items.forEach(function (it) { if (it[1] === slug) ok = true; });
  });

  if (!ok) {
    document.getElementById('msg').textContent =
      '주소가 올바르지 않습니다. 지역찾기에서 다시 선택해 주세요.';
    return;
  }

  var to = 'region/' + slug + '-vending.html' + (dong ? '?dong=' + encodeURIComponent(dong) : '');
  location.replace(to);
})();
</script>
</body>
</html>
